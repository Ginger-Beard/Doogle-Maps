plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation 'org.mockito:mockito-core:5.11.0'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.dooglemaps'
version = '1.0.0'
sourceCompatibility = '11'

// This repo is worked on from WSL but the client runs Windows-side, and the two cannot
// share Gradle's state: the Windows daemon holds locks on the project cache and on the
// class files it has loaded into a running client, which WSL then cannot delete
// ("java.io.IOException: Input/output error" out of the file hasher).
//
// run-client.sh passes -PbuildSuffix=windows along with its own --project-cache-dir, so
// each side gets its own build directory and cache and they never touch each other's.
if (project.hasProperty('buildSuffix')) {
	layout.buildDirectory = layout.projectDirectory.dir("build-${project.buildSuffix}")
}

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

test {
	// PanelRenderTest's live-window check is opt-in and needs the flag in the forked JVM.
	systemProperty 'dooglemaps.live', System.getProperty('dooglemaps.live', 'false')
	systemProperty 'dooglemaps.renderOut', System.getProperty('dooglemaps.renderOut', 'build/panel.png')
}

// REMOVE BEFORE PUBLISHING — this whole block; see docs/TODO.md "Before publishing to the Hub".
//
// The sibling resource-monitor plugin rides along in the same dev client, so the two can be
// exercised together before either is published. Its main sources join THIS project's test
// compile — the sourceset the launcher runs from — whenever the repo is checked out beside
// this one; the launcher then loads its plugin class by name if it is present, and simply
// starts a single-plugin client when it is not. A relative path, deliberately: run-client.sh
// executes the Windows-side Gradle from the C: checkout, and ../resource-monitor is the same
// place from both sides. Publishing is untouched — the Plugin Hub builds main sources only.
def resourceMonitorSources = file('../resource-monitor/src/main/java') // REMOVE BEFORE PUBLISHING
if (resourceMonitorSources.exists()) { // REMOVE BEFORE PUBLISHING
	sourceSets.test.java.srcDir resourceMonitorSources // REMOVE BEFORE PUBLISHING
	def resourceMonitorResources = file('../resource-monitor/src/main/resources') // REMOVE BEFORE PUBLISHING
	if (resourceMonitorResources.exists()) { // REMOVE BEFORE PUBLISHING
		sourceSets.test.resources.srcDir resourceMonitorResources // REMOVE BEFORE PUBLISHING
	} // REMOVE BEFORE PUBLISHING
	dependencies { // REMOVE BEFORE PUBLISHING
		// Lombok for the guest sources (@Slf4j and friends); this project's own tests
		// never needed it, so the test sourceset had no processor until now.
		testCompileOnly 'org.projectlombok:lombok:1.18.30' // REMOVE BEFORE PUBLISHING
		testAnnotationProcessor 'org.projectlombok:lombok:1.18.30' // REMOVE BEFORE PUBLISHING
	} // REMOVE BEFORE PUBLISHING
} // REMOVE BEFORE PUBLISHING

task runClient(type: JavaExec) {
	group = 'application'
	description = 'Run RuneLite with the plugin'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.dooglemaps.DoogleMapsPluginTest'
	args = ['--developer-mode']

	// -PdebugClient opens a debugger port so an IDE can hot-swap changed classes into the
	// running client, which saves a relaunch for anything that only changes a method body.
	// suspend=n so the client still starts on its own if nothing ever attaches.
	//
	// Loopback only, and that is load-bearing: JDWP has no authentication, so whoever can
	// reach the port can run code in a JVM that is logged into the account. `*:5005` would
	// offer that to the whole LAN.
	jvmArgs = project.hasProperty('debugClient')
		? ['-ea', '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005']
		: ['-ea']
}
